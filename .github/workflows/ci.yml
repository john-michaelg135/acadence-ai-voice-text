name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff format --check main.py build_exe.py database screens utils tests
      - run: python -m ruff check main.py build_exe.py database screens utils tests
      - run: python -m mypy --no-incremental
      - run: python -m unittest discover -v
      - run: python -m compileall -q main.py build_exe.py database screens utils tests
      - run: python -m pip check
