name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native:
    uses: ./.github/workflows/build.yml
  checks:
    if: always()
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - name: Require every platform to pass
        env:
          RESULT: ${{ needs.native.result }}
        run: test "$RESULT" = success
