[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist", "scratch", "design-reference", "read_excel.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
explicit_package_bases = true
check_untyped_defs = true
files = ["main.py", "app_version.py", "build_exe.py", "database", "screens", "utils", "scripts"]
